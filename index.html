<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shivanetra Engine</title>
  <script src="https://tailwindcss.com"></script>
  <style>
    body { background-color: #000000; color: #FFFFFF; font-family: ui-sans-serif, system-ui, sans-serif; }
    .text-brand-green { color: #48BB78; }
    .text-brand-red { color: #E53E3E; }
    .bg-brand-red { background-color: #E53E3E; }
    /* Style overrides to make native mobile dropdown look sleek on pitch black background */
    select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://w3.org'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 6px center;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen justify-between p-4 max-w-md mx-auto relative select-none">

  <!-- STARK BLACK HEADER BLOCK WITH WHITE BOLD TYPOGRAPHY -->
  <header class="bg-black text-center pt-6 pb-4 border-b border-neutral-900">
    <h1 class="text-3xl font-black tracking-widest text-white uppercase">
      SHIVANETRA
    </h1>
    <p id="sub-header" class="text-brand-green text-xs font-bold tracking-widest uppercase mt-2">
      Daily Horoscope Calculator
    </p>
  </header>

  <!-- STEP ROUTER MAIN INTERFACE -->
  <main class="flex-grow flex flex-col justify-center my-6">
    
    <!-- PAGE 1: UNIVERSAL LANDING PAGE -->
    <section id="step-1" class="space-y-4">
      <div class="space-y-3 bg-neutral-950 p-5 rounded-lg border border-neutral-900">
        <div>
          <label class="block text-xs uppercase tracking-wider text-neutral-400 mb-1">Full Birth Name</label>
          <input type="text" id="input-name" class="w-full bg-neutral-900 border border-neutral-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-white" placeholder="Enter full name">
        </div>

        <!-- 🔄 UPDATED COMPONENT: MANUAL DROPDOWN SELECTOR ARRAYS FOR BIRTH DATE -->
        <div>
          <label class="block text-xs uppercase tracking-wider text-neutral-400 mb-1">Date of Birth</label>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <select id="dob-day" class="w-full bg-neutral-900 border border-neutral-800 rounded pl-3 pr-6 py-2 text-sm text-white focus:outline-none focus:border-white">
                <option value="">Day</option>
                <!-- Generated dynamically via tracking loop script -->
              </select>
            </div>
            <div>
              <select id="dob-month" class="w-full bg-neutral-900 border border-neutral-800 rounded pl-3 pr-6 py-2 text-sm text-white focus:outline-none focus:border-white">
                <option value="">Month</option>
                <option value="01">Jan</option>
                <option value="02">Feb</option>
                <option value="03">Mar</option>
                <option value="04">Apr</option>
                <option value="05">May</option>
                <option value="06">Jun</option>
                <option value="07">Jul</option>
                <option value="08">Aug</option>
                <option value="09">Sep</option>
                <option value="10">Oct</option>
                <option value="11">Nov</option>
                <option value="12">Dec</option>
              </select>
            </div>
            <div>
              <select id="dob-year" class="w-full bg-neutral-900 border border-neutral-800 rounded pl-3 pr-6 py-2 text-sm text-white focus:outline-none focus:border-white">
                <option value="">Year</option>
                <!-- Generated dynamically via tracking loop script -->
              </select>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs uppercase tracking-wider text-neutral-400 mb-1">Birth Time</label>
            <input type="time" id="input-time" class="w-full bg-neutral-900 border border-neutral-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wider text-neutral-400 mb-1">Birth Place</label>
            <input type="text" id="input-place" class="w-full bg-neutral-900 border border-neutral-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-white" placeholder="e.g. Dhaka, London">
          </div>
        </div>
      </div>
    </section>

    <!-- PAGE 2: HOROSCOPE & NATAL CHART -->
    <section id="step-2" class="hidden space-y-4">
      <div class="border border-neutral-800 p-4 rounded bg-neutral-950 space-y-4">
        <div>
          <h3 class="text-xs font-bold text-neutral-400 uppercase tracking-wider mb-1">a. Surya Siddhanta Log Data</h3>
          <p id="surya-log" class="text-xs text-neutral-400 font-mono bg-black p-2 rounded border border-neutral-900 text-justify"></p>
        </div>
        
        <div>
          <h3 class="text-xs font-bold text-neutral-400 uppercase tracking-wider mb-2">e. Calculated Natal Chart Grid</h3>
          <div id="natal-chart-slot"></div>
        </div>
      </div>
    </section>

    <!-- PAGE 3: KABBALAH CODE -->
    <section id="step-3" class="hidden space-y-3">
      <div class="border border-neutral-800 p-5 rounded bg-neutral-950 space-y-3 text-center">
        <h3 class="text-xs font-bold text-neutral-400 uppercase tracking-widest">b. Kabbalah Alphanumeric Result</h3>
        <div class="text-5xl font-black text-brand-green py-4 tracking-tighter" id="kabala-val">--</div>
        <p id="kabala-desc" class="text-xs text-neutral-400 text-justify px-2"></p>
      </div>
    </section>

    <!-- PAGE 4: FENG SHUI / LO SHU & CHINESE ZODIAC -->
    <section id="step-4" class="hidden space-y-4">
      <div class="border border-neutral-800 p-4 rounded bg-neutral-950 space-y-3">
        <h3 class="text-xs font-bold text-neutral-400 uppercase tracking-widest text-center">c. Lo Shu Grid Metaphysics</h3>
        
        <div class="grid grid-cols-3 gap-1 max-w-[160px] mx-auto text-center font-bold text-sm bg-black p-1 border border-neutral-900">
          <div class="border border-neutral-900 p-2 text-neutral-800" id="ls-4">4</div>
          <div class="border border-neutral-900 p-2 text-neutral-800" id="ls-9">9</div>
          <div class="border border-neutral-900 p-2 text-neutral-800" id="ls-2">2</div>
          <div class="border border-neutral-900 p-2 text-neutral-800" id="ls-3">3</div>
          <div class="border border-neutral-900 p-2 text-neutral-800" id="ls-5">5</div>
          <div class="border border-neutral-900 p-2 text-neutral-800" id="ls-7">7</div>
          <div class="border border-neutral-900 p-2 text-neutral-800" id="ls-8">8</div>
          <div class="border border-neutral-900 p-2 text-neutral-800" id="ls-1">1</div>
          <div class="border border-neutral-900 p-2 text-neutral-800" id="ls-6">6</div>
        </div>
        
        <p class="text-center text-xs text-neutral-300 border-t border-neutral-900 pt-2 font-mono">
          Calculated Chinese Zodiac: <span id="zodiac-val" class="text-brand-green font-bold">--</span>
        </p>
      </div>
    </section>

    <!-- PAGE 5: DYNAMIC PREDICTIONS PANEL -->
    <section id="step-5" class="hidden space-y-3">
      <div class="grid grid-cols-3 gap-1 text-[10px] uppercase font-bold text-center border-b border-neutral-900 pb-2 mb-2">
        <button id="tab-f" class="text-brand-green border-b-2 border-brand-green pb-1" data-type="f">f. Daily</button>
        <button id="tab-g" class="text-neutral-500 pb-1" data-type="g">g. Monthly</button>
        <button id="tab-d" class="text-neutral-500 pb-1" data-type="d">d. 60+30 Matrix</button>
      </div>

      <div class="space-y-2 text-xs max-h-[260px] overflow-y-auto pr-1" id="predictions-box">
        <div class="bg-neutral-950 p-2 rounded border border-neutral-900">
          <span class="text-[10px] uppercase font-bold text-brand-green">🏥 Health</span>
          <p id="p-health" class="text-neutral-400 mt-0.5 text-justify"></p>
        </div>
        <div class="bg-neutral-950 p-2 rounded border border-neutral-900">
          <span class="text-[10px] uppercase font-bold text-brand-green">✈️ Travel</span>
          <p id="p-travel" class="text-neutral-400 mt-0.5 text-justify"></p>
        </div>
        <div class="bg-neutral-950 p-2 rounded border border-neutral-900">
          <span class="text-[10px] uppercase font-bold text-brand-green">💰 Money</span>
          <p id="p-money" class="text-neutral-400 mt-0.5 text-justify"></p>
        </div>
        <div class="bg-neutral-950 p-2 rounded border border-neutral-900">
          <span class="text-[10px] uppercase font-bold text-brand-green">❤️ Love</span>
          <p id="p-love" class="text-neutral-400 mt-0.5 text-justify"></p>
        </div>
        <div class="bg-neutral-950 p-2 rounded border border-brand-red/30">
          <span class="text-[10px] uppercase font-bold text-brand-red">⚠️ Precautions</span>
          <p id="p-precaution" class="text-neutral-400 mt-0.5 text-justify"></p>
        </div>
      </div>
    </section>

  </main>

  <!-- NAVIGATION CONTROL ELEMENT -->
  <footer class="space-y-3 pb-2 border-t border-neutral-900 pt-4">
    <div class="flex gap-2">
      <button id="btn-back" class="hidden w-1/3 bg-neutral-950 border border-neutral-800 text-xs uppercase font-bold py-3 rounded active:bg-neutral-900 transition">Back</button>
      <button id="btn-next" class="w-full bg-white text-black text-xs uppercase font-black tracking-widest py-3 rounded active:scale-[0.99] transition">Next</button>
    </div>
    
    <div class="flex justify-between items-center text-[10px] text-neutral-600 pt-2">
