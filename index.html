<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shivanetra Suite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #000000; color: #ffffff; font-family: -apple-system, system-ui, sans-serif; padding: 20px; max-width: 420px; margin: 0 auto; }
    
    header { text-align: center; padding: 25px 0; border-bottom: 1px solid #1c1c1c; margin-bottom: 25px; }
    h1 { font-size: 34px; font-weight: 900; tracking: 6px; color: #ffffff; text-transform: uppercase; }
    .sub-head { color: #48BB78; font-size: 11px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-top: 8px; }
    
    .card { background-color: #0b0b0b; border: 1px solid #1c1c1c; padding: 22px; border-radius: 8px; margin-bottom: 15px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 11px; color: #a3a3a3; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    
    input[type="text"], input[type="time"], select {
      width: 100%; background-color: #141414; border: 1px solid #262626; color: #ffffff; 
      padding: 12px; font-size: 14px; border-radius: 6px; outline: none; display: block;
    }
    input:focus, select:focus { border-color: #ffffff; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .loshu-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; max-width: 180px; margin: 20px auto; background-color: #000; padding: 6px; border: 1px solid #222; }
    .loshu-cell { border: 1px solid #111; padding: 14px 0; text-align: center; font-size: 16px; color: #2a2a2a; font-weight: bold; }
    .loshu-active { color: #48BB78 !important; font-weight: 900 !important; background-color: #141414; border-color: #48BB78; }

    .natal-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; max-width: 290px; margin: 20px auto; background-color: #d4d4d4; padding: 2px; border-radius: 4px; }
    .natal-cell { background-color: #ffffff; color: #000000; height: 75px; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; font-family: monospace; font-size: 10px; }
    .natal-cell .label { color: #8a8a8a; font-size: 9px; font-weight: bold; }
    .natal-cell .val { font-weight: 900; text-align: center; color: #111; line-height: 1.2; }
    .natal-center { background-color: #f4f4f4; color: #737373; justify-content: center; align-items: center; font-weight: 900; font-size: 10px; letter-spacing: 1px; }

    .tab-container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 15px; }
    .tab-btn { background: none; border: none; color: #525252; font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 8px 0; cursor: pointer; }
    .tab-active { color: #48BB78; border-bottom: 2px solid #48BB78; }
    
    .pred-item { background-color: #000000; border: 1px solid #111; padding: 14px; border-radius: 6px; margin-bottom: 10px; }
    .pred-title { font-size: 10px; font-weight: bold; text-transform: uppercase; color: #48BB78; margin-bottom: 4px; display: block; }
    .pred-text { font-size: 13px; color: #d4d4d4; text-align: justify; line-height: 1.4; }
    
    footer { border-top: 1px solid #1c1c1c; margin-top: 40px; padding-top: 20px; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
    button.primary { flex: 1; background-color: #ffffff; color: #000000; border: none; padding: 15px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; border-radius: 6px; cursor: pointer; }
    button.secondary { width: 35%; background-color: #000; color: #ffffff; border: 1px solid #222; padding: 15px; font-size: 12px; font-weight: bold; text-transform: uppercase; border-radius: 6px; cursor: pointer; }
    .dl-btn { background: none; border: none; color: #525252; font-size: 10px; font-weight: bold; text-transform: uppercase; text-decoration: underline; cursor: pointer; }
    .version-tag { float: right; font-size: 10px; font-family: monospace; color: #262626; letter-spacing: 1px; }
    
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .log-box { font-family: monospace; font-size: 11px; color: #a3a3a3; background-color: #000; padding: 10px; border-radius: 4px; border: 1px solid #111; word-break: break-all; }
  </style>
</head>
<body>

  <header>
    <h1>SHIVANETRA</h1>
    <div id="sub-header" class="sub-head">Daily Horoscope Calculator</div>
  </header>

  <main>
    <!-- PAGE 1: DROP-DOWN INPUT LAYOUT -->
    <section id="step-1" class="card">
      <div class="form-group">
        <label>Full Birth Name</label>
        <input type="text" id="input-name" placeholder="Enter full name">
      </div>
      
      <div class="form-group">
        <label>Date of Birth</label>
        <div class="grid-3">
          <select id="dob-day"><option value="">Day</option></select>
          <select id="dob-month">
            <option value="">Month</option>
            <option value="01">Jan</option><option value="02">Feb</option><option value="03">Mar</option>
            <option value="04">Apr</option><option value="05">May</option><option value="06">Jun</option>
            <option value="07">Jul</option><option value="08">Aug</option><option value="09">Sep</option>
            <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
          </select>
          <select id="dob-year"><option value="">Year</option></select>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Birth Time</label>
          <input type="time" id="input-time">
        </div>
        <div class="form-group">
          <label>Birth Place</label>
          <input type="text" id="input-place" placeholder="e.g. Dhaka">
        </div>
      </div>
    </section>

    <!-- PAGE 2: HIGH-CONTRAST NATAL CHART GRID -->
    <section id="step-2" class="card hidden">
      <label style="margin-bottom: 8px;">a. Surya Siddhanta Log Data</label>
      <div id="surya-log" class="log-box" style="margin-bottom: 20px;"></div>

      <label style="margin-bottom: 8px;">e. Calculated Natal Chart Grid</label>
      <div class="natal-grid">
        <div class="natal-cell"><span class="label">XII</span><span class="val" id="nc-12">-</span></div>
        <div class="natal-cell" style="color:#E53E3E;"><span class="label">I</span><span class="val" id="nc-1">ASC</span></div>
        <div class="natal-cell"><span class="label">II</span><span class="val" id="nc-2">-</span></div>
        <div class="natal-cell"><span class="label">XI</span><span class="val" id="nc-11">-</span></div>
        <div class="natal-cell natal-center">SURYA</div>
        <div class="natal-cell"><span class="label">III</span><span class="val" id="nc-3">-</span></div>
        <div class="natal-cell"><span class="label">X</span><span class="val" id="nc-10">-</span></div>
        <div class="natal-cell" style="color:#e53e3e;"><span class="label">IX</span><span class="val" id="nc-9">-</span></div>
        <div class="natal-cell"><span class="label">IV</span><span class="val" id="nc-4">-</span></div>
      </div>
    </section>

    <!-- PAGE 3: KABBALAH VALUE PAGE -->
    <section id="step-3" class="card hidden text-center">
      <label>b. Kabbalah Alphanumeric Result</label>
      <div id="kabala-val" style="font-size: 64px; font-weight: 900; color: #48BB78; padding: 20px 0;">--</div>
      <p id="kabala-desc" class="pred-text" style="color: #a3a3a3;"></p>
    </section>

    <!-- PAGE 4: FENG SHUI / LO SHU DISPLAY LAYOUT -->
    <section id="step-4" class="card hidden">
      <label class="text-center">c. Lo Shu Grid Metaphysics</label>
      <div class="loshu-grid">
        <div class="loshu-cell" id="ls-4">4</div><div class="loshu-cell" id="ls-9">9</div><div class="loshu-cell" id="ls-2">2</div>
        <div class="loshu-cell" id="ls-3">3</div><div class="loshu-cell" id="ls-5">5</div><div class="loshu-cell" id="ls-7">7</div>
        <div class="loshu-cell" id="ls-8">8</div><div class="loshu-cell" id="ls-1">1</div><div class="loshu-cell" id="ls-6">6</div>
      </div>
      <p class="text-center" style="font-size: 12px; color: #a3a3a3; margin-top: 15px; font-family: monospace;">
        Calculated Chinese Zodiac: <span id="zodiac-val" style="color:#48BB78; font-weight: bold;">--</span>
      </p>
    </section>

    <!-- PAGE 5: SYSTEM TIMELINE DASHBOARD -->
    <section id="step-5" class="card hidden">
      <div class="tab-container">
        <button id="tab-f" class="tab-btn tab-active">f. Daily</button>
        <button id="tab-g" class="tab-btn">g. Monthly</button>
        <button id="tab-d" class="tab-btn">d. 60+30 Matrix</button>
      </div>

      <div class="pred-item"><span class="pred-title">🏥 Health</span><p id="p-health" class="pred-text"></p></div>
      <div class="pred-item"><span class="pred-title">✈️ Travel</span><p id="p-travel" class="pred-text"></p></div>
      <div class="pred-item"><span class="pred-title">💰 Money</span><p id="p-money" class="pred-text"></p></div>
      <div class="pred-item"><span class="pred-title">❤️ Love</span><p id="p-love" class="pred-text"></p></div>
      <div class="pred-item" style="border-color: rgba(229,62,62,0.3);"><span class="pred-title" style="color:#E53E3E;">⚠️ Precautions</span><p id="p-precaution" class="pred-text"></p></div>
    </section>
  </main>

  <footer>
    <div class="btn-group">
      <button id="btn-back" class="secondary hidden">Back</button>
      <button id="btn-next" class="primary">Next</button>
    </div>
    <button id="btn-download" class="dl-btn">💾 Download Page HTML</button>
    <span class="version-tag">SHIVANETRA v1.0</span>
  </footer>

  <script>
